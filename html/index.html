<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instituto Renascer | Início</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Skip link: permite pular a navegação e ir direto ao conteúdo
       principal via teclado (WCAG 2.4.1 — Bypass Blocks) -->
  <a href="#app" class="skip-link">Pular para o conteúdo principal</a>

  <header>
    <a href="#/" data-rota class="logo">Instituto Renascer</a>

    <button
      type="button"
      id="botao-alto-contraste"
      class="botao-contraste"
      aria-pressed="false"
    >Alto contraste</button>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label
      for="nav-toggle"
      class="hamburger"
      aria-label="Abrir menu de navegação"
      aria-expanded="false"
      aria-controls="menu-principal"
    >
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </label>
    <nav aria-label="Navegação principal">
      <ul id="menu-principal">
        <li><a href="#/" data-rota>Início</a></li>
        <li><a href="#/projetos" data-rota>Projetos</a></li>
        <li><a href="#/cadastro" data-rota>Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <!-- #app é o único container de conteúdo: o router.js troca o que
       existe aqui dentro a cada navegação, sem recarregar a página.
       aria-live="polite" garante que leitores de ecrã anunciem a nova
       "página" a cada troca de rota, já que não há recarregamento real
       que disparasse esse anúncio nativamente. -->
  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer>
    <address>
      <p>&copy; 2026 Instituto Renascer — Todos os direitos reservados.</p>
      <p><a href="mailto:contato@institutorenascer.org.br">contato@institutorenascer.org.br</a></p>
    </address>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Scripts carregados como tags normais (não type="module") de propósito:
       assim o projeto funciona abrindo o index.html direto no navegador
       (file://), sem esbarrar no bloqueio de CORS que módulos ES sofrem
       nesse protocolo. A modularização é feita via namespace Renascer.* -->
  <!-- Biblioteca externa: IMask.js, para máscaras de input mais robustas
       que o CPF/telefone/CEP manuais (ver análise na resposta dissertativa) -->
  <script src="https://cdn.jsdelivr.net/npm/imask@7.6.1/dist/imask.min.js"></script>

  <script src="../js/modules/acessibilidade.js"></script>
  <script src="../js/modules/storage.js"></script>
  <script src="../js/modules/templates.js"></script>
  <script src="../js/modules/eventos.js"></script>
  <script src="../js/modules/validacao.js"></script>
  <script src="../js/modules/router.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
